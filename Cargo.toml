[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/gold-silver-copper/rig2-a"
publish = false

[workspace.dependencies]
async-lock = "3.4.2"
base64 = "0.23.1"
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["std", "alloc", "async-await"] }
futures-timer = "3.0.4"
http = "1.5.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
web-time = "1.1.0"

proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
quote = "1.0.47"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
syn = { version = "3.0.6", features = ["full"] }

proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
# Pedantic lints this workspace does not follow; see AGENTS.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
doc_markdown = "allow"
single_match_else = "allow"
