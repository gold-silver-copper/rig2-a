[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/gold-silver-copper/rig2-a"
publish = false

[workspace.dependencies]
async-lock = "3.4.2"
base64 = "0.23.1"
bytes = "1.12.1"
futures = { version = "0.3.34", default-features = false, features = ["std", "alloc", "async-await"] }
futures-timer = "3.0.4"
http = "1.5.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
web-time = "1.1.0"

proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
quote = "1.0.47"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
syn = { version = "3.0.6", features = ["full"] }

proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
# Integer overflow panics in release as in debug: a wrapped count is a silent
# miscompute, a panic is a loud one.
overflow-checks = true

[workspace.lints.rust]
# `deny`, not `forbid`: rig2-sqlite registers the sqlite-vec extension through
# FFI, on one item, with a `SAFETY:` comment. Nothing else may use `unsafe`.
unsafe_code = "deny"
missing_docs = "forbid"
unreachable_pub = "forbid"
dead_code = "forbid"
unused_must_use = "forbid"
unconditional_recursion = "forbid"
# `deny`, not `forbid`: serde's derives expand to `allow(unused_extern_crates)`.
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `deny`, not `forbid`: `proptest!` expands to an `allow` of one of these.
suspicious = { level = "deny", priority = -1 }

# Panic-free outside tests (clippy.toml relaxes these inside tests).
unwrap_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
get_unwrap = "forbid"
panic_in_result_fn = "forbid"
exit = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
expect_fun_call = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
large_stack_arrays = "forbid"
read_zero_byte_vec = "forbid"
debug_assert_with_mut_call = "forbid"
significant_drop_in_scrutinee = "forbid"
unchecked_time_subtraction = "forbid"
unused_result_ok = "forbid"
mem_forget = "forbid"
await_holding_lock = "forbid"
await_holding_refcell_ref = "forbid"
# `deny`, not `forbid`: `#[tokio::test]` expands to an `allow` of these two.
expect_used = "deny"
unwrap_in_result = "deny"

# Lossy conversions and silent failures.
cast_lossless = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_possible_wrap = "forbid"
lossy_float_literal = "forbid"
float_cmp_const = "forbid"
rc_buffer = "forbid"
rest_pat_in_fully_bound_structs = "forbid"
map_err_ignore = "forbid"

# Suppress with `#[expect(.., reason = "..")]`, never `#[allow]`.
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

print_stdout = "warn"

# Pedantic and nursery lints this workspace does not follow; see AGENTS.md.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
single_match_else = "allow"
cognitive_complexity = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
# Conflicts with rustc's `unreachable_pub`: a crate-visible helper in a private
# module must be `pub(crate)`.
redundant_pub_crate = "allow"
